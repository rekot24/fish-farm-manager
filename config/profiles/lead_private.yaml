profile_name: lead_private
role: lead
server_type: private

behaviors:
  auto_farm_reset:
    enabled: true
    interval_min: 15

  end_run_reset:
    enabled: true
    interval_min: 10

  cascade_reset_on_end_run:
    enabled: true
    delay_after_lead_s: 30

  eaten_by_detection:
    enabled: true
    trigger_support_end_run: true

  rejoin_on_kick: true
  rejoin_source: global_settings   # reads private_server_link from settings.json

detectors_required:
  - auto_button_on
  - auto_button_off
  - end_run_button
  - death_screen
  - in_run_indicator
  - lobby_screen
  - roblox_home_screen
